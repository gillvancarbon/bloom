<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A7C59" />
    <title>Bloom · Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Startup splash. Inline so it paints before the app bundle loads and
         covers the brief wait while pending deletes are flushed. */
      #bloom-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        overflow: hidden;
        background: #121613;
        color: #cfe6d4;
        font-family:
          'DM Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        transition: opacity 0.3s ease;
      }
      /* The same ambient hues as the app's own background: a green glow in
         the top-right and a warm peach glow in the bottom-left. */
      #bloom-splash::before,
      #bloom-splash::after {
        content: '';
        position: absolute;
        border-radius: 9999px;
        pointer-events: none;
      }
      #bloom-splash::before {
        width: 32rem;
        height: 32rem;
        top: -10rem;
        right: -8rem;
        opacity: 0.6;
        background: radial-gradient(circle, rgb(37 66 46) 0%, rgb(37 66 46 / 0) 70%);
        animation: bloom-breathe 9s ease-in-out infinite;
      }
      #bloom-splash::after {
        width: 26rem;
        height: 26rem;
        bottom: -10rem;
        left: -8rem;
        opacity: 0.5;
        background: radial-gradient(circle, rgb(79 45 28) 0%, rgb(79 45 28 / 0) 70%);
        animation: bloom-breathe 11s ease-in-out infinite reverse;
      }
      #bloom-splash.bloom-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #bloom-splash .bloom-mark {
        position: relative;
        z-index: 1;
        display: flex;
        height: 68px;
        width: 68px;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        color: #fff;
        background: linear-gradient(145deg, #6fa97e, #4a7c59);
        box-shadow: 0 12px 32px -12px rgba(37, 66, 46, 0.55);
        animation: bloom-pulse 1.7s ease-in-out infinite;
      }
      #bloom-splash .bloom-name {
        position: relative;
        z-index: 1;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      @keyframes bloom-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes bloom-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.9);
          opacity: 0.78;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #bloom-splash::before,
        #bloom-splash::after,
        #bloom-splash .bloom-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="bloom-splash" role="status" aria-label="Loading Bloom">
      <span class="bloom-mark" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
          />
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
        </svg>
      </span>
      <span class="bloom-name">Bloom</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
