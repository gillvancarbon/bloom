server:
  port: 8080
  # Bind loopback by default so a dev machine isn't exposed on the network.
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: habit-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:file:./data/habits;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  # Schema migrations are opt-in (prod profile) so day-to-day dev keeps using
  # Hibernate's `ddl-auto: update` against the local file database.
  flyway:
    enabled: false

# Uncomment below and comment H2 block above for PostgreSQL
#  datasource:
#    url: jdbc:postgresql://localhost:5432/habittracker
#    username: habit
#    password: habit
#    driver-class-name: org.postgresql.Driver

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.habittracker: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"